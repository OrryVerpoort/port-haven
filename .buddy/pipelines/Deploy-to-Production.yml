- pipeline: deploy-to-production
  name: Deploy to Production
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  resources: NANO
  events:
  - type: PUSH
    refs:
    - refs/heads/main
  actions:
  - action: Deploy production
    type: SSH_COMMAND
    commands: cd /var/www/port-haven/production && git fetch origin main && git reset --hard origin/main && git log -1 --oneline
    targets:
    - orry_space
