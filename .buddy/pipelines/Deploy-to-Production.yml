- pipeline: deploy-to-production
  name: Deploy to Production
  refs:
  - refs/heads/main
  fail_on_prepare_env_warning: true
  resources: NANO
  events:
  - type: PUSH
    refs:
    - refs/tags/*
  actions:
  - action: Deploy production
    type: SSH_COMMAND
    commands: deploy-laravel parkpop production
    targets:
    - orry_space
